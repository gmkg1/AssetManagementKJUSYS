<!-- Create New Asset Page -->
<div class="page-wrapper">
  <!-- Breadcrumb -->
  <div class="breadcrumb">
    <span class="breadcrumb-item">I.T</span>
    <span class="separator">/</span>
    <span class="breadcrumb-item">Assets</span>
    <span class="separator">/</span>
    <span class="breadcrumb-item active">Create Asset</span>
  </div>

  <!-- Main Card -->
  <div class="card">
    <!-- Card Header -->
    <div class="card-header">
      <h2 class="card-title">Create New Asset</h2>
      <p class="card-subtitle">Asset Department – I.T</p>
    </div>

    <!-- Divider -->
    <div class="divider"></div>

    <!-- Form Content -->
    <div class="form-layout">
      <!-- Left Column -->
      <div class="form-left">

        <!-- Company -->
        <div class="form-group">
          <label class="form-label">Company</label>
          <div class="select-wrapper">
            <select class="form-select">
              <option value="" disabled selected>Select Company</option>
            </select>
            <span class="select-arrow">&#8250;</span>
          </div>
        </div>

        <!-- Asset Tag -->
        <div class="form-group">
          <label class="form-label">Asset Tag</label>
          <div class="input-with-action">
            <input type="text" class="form-input" value="ITCN0038480006" />
            <button class="btn-add-inline">+</button>
          </div>
        </div>

        <!-- Serial -->
        <div class="form-group">
          <label class="form-label">Serial</label>
          <input type="text" class="form-input" placeholder="Enter Serial Number" />
        </div>

        <!-- Model -->
        <div class="form-group">
          <label class="form-label">Model</label>
          <div class="input-with-action">
            <div class="select-wrapper flex-1">
              <select class="form-select">
                <option value="" disabled selected>Select a Model</option>
              </select>
              <span class="select-arrow">&#8250;</span>
            </div>
            <button class="btn-add-inline">+</button>
          </div>
        </div>

        <!-- Status & Asset Category -->
        <div class="form-row">
          <div class="form-group flex-1">
            <label class="form-label">Status</label>
            <div class="select-wrapper">
              <select class="form-select">
                <option value="" disabled selected>Select a Status</option>
              </select>
              <span class="select-arrow">&#8250;</span>
            </div>
          </div>
          <div class="form-group flex-1">
            <label class="form-label">Asset Category</label>
            <div class="select-wrapper">
              <select class="form-select">
                <option value="consumables">Consumables</option>
              </select>
              <span class="select-arrow">&#8250;</span>
            </div>
          </div>
        </div>

        <!-- Default Location -->
        <div class="form-group">
          <label class="form-label">Default Location</label>
          <div class="input-with-action">
            <div class="select-wrapper flex-1">
              <select class="form-select">
                <option value="" disabled selected>Select a Location – This is the location of the asset when it is not checked out</option>
              </select>
              <span class="select-arrow">&#8250;</span>
            </div>
            <button class="btn-add-inline">+</button>
          </div>
        </div>

      </div>

      <!-- Vertical Divider -->
      <div class="vertical-divider"></div>

      <!-- Right Column -->
      <div class="form-right">

        <!-- Optional Information Header -->
        <div class="section-header">
          <span class="section-title">Optional Information</span>
        </div>

        <!-- Asset Name -->
        <div class="form-group">
          <label class="form-label">Asset Name</label>
          <input type="text" class="form-input" />
        </div>

        <!-- Order Number -->
        <div class="form-group">
          <label class="form-label">Order Number</label>
          <input type="text" class="form-input" />
        </div>

        <!-- Warranty / Purchase Date / EOL Date -->
        <div class="form-row three-col">
          <div class="form-group">
            <label class="form-label">Warranty</label>
            <div class="input-suffix-wrapper">
              <input type="text" class="form-input" placeholder="" />
              <span class="input-suffix">Months</span>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Purchase Date</label>
            <div class="input-suffix-wrapper">
              <input type="text" class="form-input" placeholder="Select Date" />
              <span class="input-suffix-icon">
                <svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <rect x="0.5" y="1.5" width="13" height="12" rx="1" stroke="#7A8699" stroke-width="1.05"/>
                  <line x1="4.667" y1="0.583" x2="4.667" y2="2.333" stroke="#7A8699" stroke-width="1.05" stroke-linecap="round"/>
                  <line x1="9.333" y1="0.583" x2="9.333" y2="2.333" stroke="#7A8699" stroke-width="1.05" stroke-linecap="round"/>
                  <line x1="2.042" y1="5.25" x2="11.958" y2="5.25" stroke="#7A8699" stroke-width="1.05" stroke-linecap="round"/>
                </svg>
              </span>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">EOL Date</label>
            <div class="input-suffix-wrapper">
              <input type="text" class="form-input" placeholder="Select Date" />
              <span class="input-suffix-icon">
                <svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <rect x="0.5" y="1.5" width="13" height="12" rx="1" stroke="#7A8699" stroke-width="1.05"/>
                  <line x1="4.667" y1="0.583" x2="4.667" y2="2.333" stroke="#7A8699" stroke-width="1.05" stroke-linecap="round"/>
                  <line x1="9.333" y1="0.583" x2="9.333" y2="2.333" stroke="#7A8699" stroke-width="1.05" stroke-linecap="round"/>
                  <line x1="2.042" y1="5.25" x2="11.958" y2="5.25" stroke="#7A8699" stroke-width="1.05" stroke-linecap="round"/>
                </svg>
              </span>
            </div>
          </div>
        </div>

        <!-- Supplier -->
        <div class="form-group">
          <label class="form-label">Supplier</label>
          <div class="input-with-action">
            <div class="select-wrapper flex-1">
              <select class="form-select">
                <option value="" disabled selected>Select a Supplier</option>
              </select>
              <span class="select-arrow">&#8250;</span>
            </div>
            <button class="btn-add-inline">+</button>
          </div>
        </div>

        <!-- Purchase Cost / Upload Bill / Item Category -->
        <div class="form-row three-col align-end">
          <!-- Purchase Cost -->
          <div class="form-group">
            <label class="form-label">Purchase Cost</label>
            <div class="input-suffix-wrapper">
              <input type="text" class="form-input" />
              <span class="input-suffix">INR</span>
            </div>
          </div>

          <!-- Upload Bill -->
          <div class="form-group">
            <label class="form-label">Upload Bill</label>
            <div class="upload-area">
              <svg width="22" height="22" viewBox="0 0 22 22" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M11 14V5M11 5L8 8M11 5L14 8" stroke="rgba(0,0,0,0.4)" stroke-width="0.93" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M4 15v1.5A1.5 1.5 0 005.5 18h11a1.5 1.5 0 001.5-1.5V15" stroke="rgba(0,0,0,0.4)" stroke-width="0.93" stroke-linecap="round"/>
              </svg>
              <div class="upload-text">
                <p class="upload-primary">Select a file or drag and drop here</p>
                <p class="upload-secondary">File size no more than 1MB</p>
              </div>
            </div>
          </div>

          <!-- Item Category -->
          <div class="form-group">
            <label class="form-label">Item Category</label>
            <div class="checkbox-wrapper">
              <input type="checkbox" id="returnableAsset" class="checkbox-input" checked />
              <label for="returnableAsset" class="checkbox-label">Returnable Asset</label>
            </div>
          </div>
        </div>

        <!-- Action Buttons -->
        <div class="form-actions">
          <button class="btn-cancel">Cancel</button>
          <button class="btn-save">Save</button>
        </div>

      </div>
    </div>
  </div>
</div>
