<div class="flex flex-col h-screen w-screen overflow-hidden bg-[#F0F2F5] font-inter text-xs">

  <div class="flex flex-col flex-1 overflow-hidden">
    <div class="flex-1 overflow-y-auto p-4">

        <!-- Breadcrumb + title -->
        <div class="mb-4">
          <div class="flex items-center gap-1.5 text-[10px] text-slate-400 mb-1">
            <span>Apps</span>
            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" class="w-2.5 h-2.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="m8.25 4.5 7.5 7.5-7.5 7.5"/>
            </svg>
            <span class="text-blue-600 font-medium">Asset Management</span>
          </div>
          <h1 class="text-sm font-semibold text-slate-800 mb-3">Asset Management</h1>

          <!-- Module tab cards -->
          <lib-tabs
            [tabs]="moduleTabs"
            [activeTabId]="activeModuleTabId"
            [autoWidth]="true"
            (tabChange)="onModuleTabChange($event)">
          </lib-tabs>
        </div>

        <!-- Form card -->
        <div class="bg-white rounded-xl shadow-sm p-5">
          <h1 class="text-sm font-semibold text-slate-800 mb-0.5">Return Asset</h1>
          <p class="text-[10px] text-slate-400 mb-5">Select an issued asset to process its return</p>

          <div class="grid grid-cols-2 gap-x-8 gap-y-4">

            <!-- LEFT COLUMN -->
            <div class="flex flex-col gap-4">

              <!-- Issue ID -->
              <div class="flex flex-col gap-1 relative">
                <label class="text-[10px] text-slate-500 font-medium">Issue ID</label>
                <div class="h-8 border border-slate-200 rounded-lg px-3 flex items-center justify-between cursor-pointer hover:border-blue-400 transition-colors"
                  (click)="toggleIssueDropdown()">
                  <span class="text-xs" [class.text-slate-400]="!selectedIssueId" [class.text-slate-800]="selectedIssueId">
                    {{ selectedIssueId ? getSelectedLabel() : 'Issue Tag' }}
                  </span>
                  <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" class="w-3 h-3 text-slate-400 transition-transform" [class.rotate-180]="issueDropdownOpen">
                    <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5"/>
                  </svg>
                </div>
                <div *ngIf="issueDropdownOpen" class="absolute top-full left-0 right-0 mt-1 bg-white border border-slate-200 rounded-lg shadow-lg z-50 overflow-hidden max-h-48 overflow-y-auto">
                  <button *ngFor="let opt of issueIdOptions"
                    class="block w-full text-left px-3 py-2 text-xs text-slate-700 hover:bg-blue-50 hover:text-blue-600 transition-colors"
                    [class.bg-blue-50]="selectedIssueId === opt.value"
                    [class.text-blue-600]="selectedIssueId === opt.value"
                    (click)="onIssueSelect(opt); $event.stopPropagation()">
                    {{ opt.label }}
                  </button>
                </div>
              </div>

              <!-- Asset Name -->
              <div class="flex flex-col gap-1">
                <label class="text-[10px] text-slate-500 font-medium">Asset Name</label>
                <input type="text" [(ngModel)]="assetName" placeholder="Asset Name"
                  class="h-8 border border-slate-200 rounded-lg px-3 text-xs text-slate-800 outline-none focus:border-blue-500 transition-colors placeholder:text-slate-400"/>
              </div>

              <!-- Return Type -->
              <div class="flex flex-col gap-1">
                <label class="text-[10px] text-slate-500 font-medium">Return Type</label>
                <input type="text" [(ngModel)]="returnType" placeholder="Asset Type"
                  class="h-8 border border-slate-200 rounded-lg px-3 text-xs text-slate-800 outline-none focus:border-blue-500 transition-colors placeholder:text-slate-400"/>
              </div>

            </div>

            <!-- RIGHT COLUMN -->
            <div class="flex flex-col gap-4">

              <!-- Expected Return Date + Return Date side by side -->
              <div class="grid grid-cols-2 gap-3">
                <div class="flex flex-col gap-1">
                  <label class="text-[10px] text-slate-500 font-medium">Expected Return Date</label>
                  <div class="relative">
                    <input type="text" [(ngModel)]="expectedReturnDate" placeholder="Select Date"
                      class="w-full h-8 border border-slate-200 rounded-lg px-3 pr-8 text-xs text-slate-800 outline-none focus:border-blue-500 transition-colors placeholder:text-slate-400"/>
                    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"
                      class="absolute right-2.5 top-1/2 -translate-y-1/2 w-3.5 h-3.5 text-slate-400 pointer-events-none">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 0 1 2.25-2.25h13.5A2.25 2.25 0 0 1 21 7.5v11.25m-18 0A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75m-18 0v-7.5A2.25 2.25 0 0 1 5.25 9h13.5A2.25 2.25 0 0 1 21 11.25v7.5"/>
                    </svg>
                  </div>
                </div>
                <div class="flex flex-col gap-1">
                  <label class="text-[10px] text-slate-500 font-medium">Return Date</label>
                  <div class="relative">
                    <input type="text" [(ngModel)]="returnDate" placeholder="Select Date"
                      class="w-full h-8 border border-slate-200 rounded-lg px-3 pr-8 text-xs text-slate-800 outline-none focus:border-blue-500 transition-colors placeholder:text-slate-400"/>
                    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"
                      class="absolute right-2.5 top-1/2 -translate-y-1/2 w-3.5 h-3.5 text-slate-400 pointer-events-none">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 0 1 2.25-2.25h13.5A2.25 2.25 0 0 1 21 7.5v11.25m-18 0A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75m-18 0v-7.5A2.25 2.25 0 0 1 5.25 9h13.5A2.25 2.25 0 0 1 21 11.25v7.5"/>
                    </svg>
                  </div>
                </div>
              </div>

              <!-- Notes -->
              <div class="flex flex-col gap-1">
                <label class="text-[10px] text-slate-500 font-medium">Notes</label>
                <textarea [(ngModel)]="notes" rows="5"
                  class="border border-slate-200 rounded-lg px-3 py-2 text-xs text-slate-800 outline-none focus:border-blue-500 transition-colors resize-none placeholder:text-slate-400"></textarea>
              </div>

            </div>

          </div>

          <!-- Actions -->
          <div class="flex justify-end gap-3 mt-5 pt-4 border-t border-slate-100">
            <button type="button"
              class="h-8 px-5 rounded-lg border border-slate-200 text-xs font-medium text-slate-600 hover:border-slate-400 hover:text-slate-800 transition-all duration-150 active:scale-95"
              (click)="onCancel()">
              Cancel
            </button>
            <button type="button"
              class="h-8 px-5 rounded-lg bg-blue-600 text-white text-xs font-semibold hover:bg-blue-700 transition-all duration-150 active:scale-95"
              (click)="onReturnAsset()">
              Return Asset
            </button>
          </div>

        </div>

      </div>

      <!-- FOOTER -->
      <footer class="h-6 bg-[#434B57] flex items-center justify-center flex-shrink-0">
        <span class="text-[10px] text-white">&#169; Developed by : Software Development Centre, Kristu Jayanti (Deemed to be University), Bangalore</span>
      </footer>
    </div>

  </div>
